name: Monthly Grocery Specials

on:
  workflow_dispatch:
    inputs:
      force_send:
        description: Send even if today's email marker already exists.
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [grocery-specials]
  schedule:
    # Monthly on the 26th at 19:17 Africa/Johannesburg. Cronjob.org is primary.
    - cron: "17 17 26 * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  send-grocery-specials:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USE_TLS: "true"
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}

      GROCERY_SPECIALS_EMAIL: ${{ secrets.GROCERY_SPECIALS_EMAIL }}
      GROCERY_SPECIALS_EMAIL_TO: ${{ secrets.GROCERY_SPECIALS_EMAIL_TO }}
      GROCERY_SPECIALS_SUBJECT_PREFIX: "Midrand Grocery Specials"
      GROCERY_SPECIALS_AREA: "Midrand, Gauteng"
      GROCERY_SPECIALS_MAX_ITEMS_PER_STORE: "120"

      LOCATION_NAME: "Midrand"
      LATITUDE: "-25.9992"
      LONGITUDE: "28.1263"
      TIMEZONE: "Africa/Johannesburg"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare email send marker
        id: send-marker
        shell: bash
        run: |
          brief_date="$(TZ=Africa/Johannesburg date +%F)"
          slug="$(printf '%s' "$GITHUB_WORKFLOW" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          marker_path=".send-markers/${slug}-${brief_date}.txt"

          echo "date=${brief_date}" >> "$GITHUB_OUTPUT"
          echo "slug=${slug}" >> "$GITHUB_OUTPUT"
          echo "path=${marker_path}" >> "$GITHUB_OUTPUT"

      - name: Restore email sent marker
        id: email-marker
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.send-marker.outputs.path }}
          key: email-sent-${{ steps.send-marker.outputs.slug }}-${{ steps.send-marker.outputs.date }}

      - name: Decide whether to send email
        id: dedupe
        shell: bash
        env:
          CACHE_HIT: ${{ steps.email-marker.outputs.cache-hit }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force_send }}
        run: |
          if [ "$CACHE_HIT" = "true" ] && [ "$FORCE_SEND" != "true" ]; then
            echo "Email for ${{ steps.send-marker.outputs.date }} was already sent; skipping duplicate run."
            echo "should_send=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_send=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.dedupe.outputs.should_send == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        if: steps.dedupe.outputs.should_send == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run tests
        if: steps.dedupe.outputs.should_send == 'true'
        run: python -m unittest discover -s tests

      - name: Send grocery specials email with retries
        if: steps.dedupe.outputs.should_send == 'true'
        shell: bash
        run: |
          set +e
          : > grocery-specials-run.log

          for attempt in 1 2 3; do
            echo "::group::Grocery specials attempt ${attempt}" | tee -a grocery-specials-run.log
            daily-brief --grocery-specials --send 2>&1 | tee -a grocery-specials-run.log
            status=${PIPESTATUS[0]}
            echo "::endgroup::"

            if [ "$status" -eq 0 ]; then
              echo "Grocery specials sent on attempt ${attempt}." | tee -a grocery-specials-run.log
              exit 0
            fi

            echo "Attempt ${attempt} failed with exit code ${status}." | tee -a grocery-specials-run.log
            if [ "$attempt" -lt 3 ]; then
              echo "Waiting 15 minutes before retry..." | tee -a grocery-specials-run.log
              sleep 900
            fi
          done

          exit 1

      - name: Write email sent marker
        if: success() && steps.dedupe.outputs.should_send == 'true' && steps.email-marker.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "$(dirname "${{ steps.send-marker.outputs.path }}")"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "trigger=${GITHUB_EVENT_NAME}"
            echo "brief_date=${{ steps.send-marker.outputs.date }}"
            echo "sent_at=$(date -u +%FT%TZ)"
          } > "${{ steps.send-marker.outputs.path }}"

      - name: Save email sent marker
        if: success() && steps.dedupe.outputs.should_send == 'true' && steps.email-marker.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.send-marker.outputs.path }}
          key: email-sent-${{ steps.send-marker.outputs.slug }}-${{ steps.send-marker.outputs.date }}

      - name: Send failure alert
        if: failure() && steps.dedupe.outputs.should_send == 'true'
        run: |
          daily-brief --send-failure-alert \
            --failure-alert-name "Midrand Grocery Specials" \
            --failure-log grocery-specials-run.log \
            --failure-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
