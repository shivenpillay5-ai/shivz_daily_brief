name: Monthly Grocery Specials

on:
  workflow_dispatch:
  repository_dispatch:
    types: [grocery-specials]

jobs:
  send-grocery-specials:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USE_TLS: "true"
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}

      GROCERY_SPECIALS_EMAIL_TO: ${{ secrets.GROCERY_SPECIALS_EMAIL_TO }}
      GROCERY_SPECIALS_SUBJECT_PREFIX: "Midrand Grocery Specials"
      GROCERY_SPECIALS_AREA: "Midrand, Gauteng"
      GROCERY_SPECIALS_MAX_ITEMS_PER_STORE: "120"

      LOCATION_NAME: "Midrand"
      LATITUDE: "-25.9992"
      LONGITUDE: "28.1263"
      TIMEZONE: "Africa/Johannesburg"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Send grocery specials email with retries
        shell: bash
        run: |
          set +e
          : > grocery-specials-run.log

          for attempt in 1 2 3; do
            echo "::group::Grocery specials attempt ${attempt}" | tee -a grocery-specials-run.log
            daily-brief --grocery-specials --send 2>&1 | tee -a grocery-specials-run.log
            status=${PIPESTATUS[0]}
            echo "::endgroup::"

            if [ "$status" -eq 0 ]; then
              echo "Grocery specials sent on attempt ${attempt}." | tee -a grocery-specials-run.log
              exit 0
            fi

            echo "Attempt ${attempt} failed with exit code ${status}." | tee -a grocery-specials-run.log
            if [ "$attempt" -lt 3 ]; then
              echo "Waiting 15 minutes before retry..." | tee -a grocery-specials-run.log
              sleep 900
            fi
          done

          exit 1

      - name: Send failure alert
        if: failure()
        run: |
          daily-brief --send-failure-alert \
            --failure-alert-name "Midrand Grocery Specials" \
            --failure-log grocery-specials-run.log \
            --failure-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
