name: Shivz Daily Brief

on:
  workflow_dispatch:
    inputs:
      force_send:
        description: Send even if today's email marker already exists.
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [daily-brief]
  schedule:
    # 08:17 Africa/Johannesburg. Cronjob.org is primary; this is a later fallback.
    - cron: "17 6 * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  send-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5
      MARKET_PULSE_ENABLED: "true"

      LOCATION_NAME: Johannesburg
      LATITUDE: "-26.2041"
      LONGITUDE: "28.0473"
      TIMEZONE: Africa/Johannesburg
      WEATHER_LOCATIONS: "Midrand|-25.9992|28.1263|Africa/Johannesburg|hourly;Johannesburg|-26.2041|28.0473|Africa/Johannesburg;Cape Town|-33.9249|18.4241|Africa/Johannesburg;Durban|-29.8587|31.0218|Africa/Johannesburg"

      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USE_TLS: "true"
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      EMAIL_SUBJECT_PREFIX: Shivz Daily Brief

      WHATSAPP_ENABLED: ${{ secrets.WHATSAPP_ENABLED }}
      WHATSAPP_API_VERSION: v24.0
      WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${{ secrets.WHATSAPP_BUSINESS_ACCOUNT_ID }}
      WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
      WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
      WHATSAPP_TEMPLATE_NAME: shivz_daily_brief_v1
      WHATSAPP_TEMPLATE_LANGUAGE: en

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare email send marker
        id: send-marker
        shell: bash
        run: |
          brief_date="$(TZ=Africa/Johannesburg date +%F)"
          slug="$(printf '%s' "$GITHUB_WORKFLOW" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          marker_path=".send-markers/${slug}-${brief_date}.txt"

          echo "date=${brief_date}" >> "$GITHUB_OUTPUT"
          echo "slug=${slug}" >> "$GITHUB_OUTPUT"
          echo "path=${marker_path}" >> "$GITHUB_OUTPUT"

      - name: Restore email sent marker
        id: email-marker
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.send-marker.outputs.path }}
          key: email-sent-${{ steps.send-marker.outputs.slug }}-${{ steps.send-marker.outputs.date }}

      - name: Decide whether to send email
        id: dedupe
        shell: bash
        env:
          CACHE_HIT: ${{ steps.email-marker.outputs.cache-hit }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force_send }}
        run: |
          if [ "$CACHE_HIT" = "true" ] && [ "$FORCE_SEND" != "true" ]; then
            echo "Email for ${{ steps.send-marker.outputs.date }} was already sent; skipping duplicate run."
            echo "should_send=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_send=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.dedupe.outputs.should_send == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        if: steps.dedupe.outputs.should_send == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run tests
        if: steps.dedupe.outputs.should_send == 'true'
        run: python -m unittest discover -s tests

      - name: Send email brief with retries
        if: steps.dedupe.outputs.should_send == 'true'
        shell: bash
        run: |
          set +e
          : > daily-brief-run.log

          for attempt in 1 2 3; do
            echo "::group::Daily brief attempt ${attempt}" | tee -a daily-brief-run.log
            daily-brief --send 2>&1 | tee -a daily-brief-run.log
            status=${PIPESTATUS[0]}
            echo "::endgroup::"

            if [ "$status" -eq 0 ]; then
              echo "Daily brief sent on attempt ${attempt}." | tee -a daily-brief-run.log
              exit 0
            fi

            echo "Attempt ${attempt} failed with exit code ${status}." | tee -a daily-brief-run.log
            if [ "$attempt" -lt 3 ]; then
              echo "Waiting 15 minutes before retry..." | tee -a daily-brief-run.log
              sleep 900
            fi
          done

          exit 1

      - name: Write email sent marker
        if: success() && steps.dedupe.outputs.should_send == 'true' && steps.email-marker.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "$(dirname "${{ steps.send-marker.outputs.path }}")"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "trigger=${GITHUB_EVENT_NAME}"
            echo "brief_date=${{ steps.send-marker.outputs.date }}"
            echo "sent_at=$(date -u +%FT%TZ)"
          } > "${{ steps.send-marker.outputs.path }}"

      - name: Save email sent marker
        if: success() && steps.dedupe.outputs.should_send == 'true' && steps.email-marker.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.send-marker.outputs.path }}
          key: email-sent-${{ steps.send-marker.outputs.slug }}-${{ steps.send-marker.outputs.date }}

      - name: Send WhatsApp template with retries
        if: steps.dedupe.outputs.should_send == 'true' && env.WHATSAPP_ENABLED == 'true' && env.WHATSAPP_ACCESS_TOKEN != '' && env.WHATSAPP_TO != ''
        shell: bash
        run: |
          set +e

          for attempt in 1 2 3; do
            echo "::group::WhatsApp template attempt ${attempt}" | tee -a daily-brief-run.log
            daily-brief --send-whatsapp-template 2>&1 | tee -a daily-brief-run.log
            status=${PIPESTATUS[0]}
            echo "::endgroup::"

            if [ "$status" -eq 0 ]; then
              echo "WhatsApp template sent on attempt ${attempt}." | tee -a daily-brief-run.log
              exit 0
            fi

            echo "Attempt ${attempt} failed with exit code ${status}." | tee -a daily-brief-run.log
            if [ "$attempt" -lt 3 ]; then
              echo "Waiting 15 minutes before retry..." | tee -a daily-brief-run.log
              sleep 900
            fi
          done

          exit 1

      - name: Send failure alert
        if: failure() && steps.dedupe.outputs.should_send == 'true'
        run: |
          daily-brief --send-failure-alert \
            --failure-log daily-brief-run.log \
            --failure-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
