name: Team ShiNola - Our Daily Brief

on:
  workflow_dispatch:
    inputs:
      force_send:
        description: Send even if today's email marker already exists.
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [team-shinola-brief]
  schedule:
    # 10:17 Africa/Johannesburg. Cronjob.org is primary; this is a later fallback.
    - cron: "17 8 * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  send-couple-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USE_TLS: "true"
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}

      COUPLE_EMAIL_TO: ${{ secrets.COUPLE_EMAIL_TO }}
      COUPLE_SUBJECT_PREFIX: "Team ShiNola - Our Daily Brief"
      COUPLE_NAMES: "Shivz and Nola"
      COUPLE_REMINDERS: "Check the shared Gmail calendar for anything that needs a family handoff.;Pick one small admin item to close before it becomes background noise.;Keep dinner simple enough that the evening still has breathing room."

      LOCATION_NAME: "Johannesburg"
      LATITUDE: "-26.2041"
      LONGITUDE: "28.0473"
      TIMEZONE: "Africa/Johannesburg"

      GOOGLE_CALENDAR_ENABLED: "true"
      GOOGLE_CALENDAR_CREDENTIALS_FILE: "credentials.json"
      GOOGLE_CALENDAR_TOKEN_FILE: "token.json"
      GOOGLE_CALENDAR_IDS: "primary|Shiven"
      GOOGLE_CALENDAR_LOOKAHEAD_DAYS: "7"
      GOOGLE_CALENDAR_MAX_EVENTS_PER_CALENDAR: "12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare email send marker
        id: send-marker
        shell: bash
        run: |
          brief_date="$(TZ=Africa/Johannesburg date +%F)"
          slug="$(printf '%s' "$GITHUB_WORKFLOW" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          marker_path=".send-markers/${slug}-${brief_date}.txt"

          echo "date=${brief_date}" >> "$GITHUB_OUTPUT"
          echo "slug=${slug}" >> "$GITHUB_OUTPUT"
          echo "path=${marker_path}" >> "$GITHUB_OUTPUT"

      - name: Restore email sent marker
        id: email-marker
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.send-marker.outputs.path }}
          key: email-sent-${{ steps.send-marker.outputs.slug }}-${{ steps.send-marker.outputs.date }}

      - name: Check successful runs today
        id: run-history
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MARKER_DATE: ${{ steps.send-marker.outputs.date }}
          WORKFLOW_FILE: daily-couple-brief.yml
        run: |
          url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/runs?branch=${GITHUB_REF_NAME}&status=success&per_page=20"

          if ! response="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$url")"; then
            echo "Could not check prior workflow runs; falling back to the cache marker only."
            echo "prior_success=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          runs_json="$(mktemp)"
          trap 'rm -f "$runs_json"' EXIT
          printf '%s' "$response" > "$runs_json"

          prior_success="$(
            python3 - "$MARKER_DATE" "$GITHUB_RUN_ID" "$runs_json" <<'PY'
          import json
          import sys
          from datetime import datetime
          from zoneinfo import ZoneInfo

          target_date = sys.argv[1]
          current_run_id = sys.argv[2]
          runs_json_path = sys.argv[3]
          with open(runs_json_path, encoding="utf-8") as runs_json_file:
              data = json.load(runs_json_file)
          timezone = ZoneInfo("Africa/Johannesburg")

          for run in data.get("workflow_runs", []):
              if str(run.get("id")) == current_run_id:
                  continue
              if run.get("conclusion") != "success":
                  continue
              created_at = run.get("created_at")
              if not created_at:
                  continue
              created_date = (
                  datetime.fromisoformat(created_at.replace("Z", "+00:00"))
                  .astimezone(timezone)
                  .date()
                  .isoformat()
              )
              if created_date == target_date:
                  print("true")
                  break
          else:
              print("false")
          PY
          )"

          echo "prior_success=${prior_success}" >> "$GITHUB_OUTPUT"

      - name: Decide whether to send email
        id: dedupe
        shell: bash
        env:
          CACHE_HIT: ${{ steps.email-marker.outputs.cache-hit }}
          PRIOR_SUCCESS: ${{ steps.run-history.outputs.prior_success }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force_send }}
        run: |
          if { [ "$CACHE_HIT" = "true" ] || [ "$PRIOR_SUCCESS" = "true" ]; } && [ "$FORCE_SEND" != "true" ]; then
            echo "Email for ${{ steps.send-marker.outputs.date }} was already sent; skipping duplicate run."
            echo "should_send=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_send=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.dedupe.outputs.should_send == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        if: steps.dedupe.outputs.should_send == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run tests
        if: steps.dedupe.outputs.should_send == 'true'
        run: python -m unittest discover -s tests

      - name: Write Google Calendar OAuth files
        if: steps.dedupe.outputs.should_send == 'true'
        shell: bash
        env:
          GOOGLE_CALENDAR_CREDENTIALS_JSON_B64: ${{ secrets.GOOGLE_CALENDAR_CREDENTIALS_JSON_B64 }}
          GOOGLE_CALENDAR_TOKEN_JSON_B64: ${{ secrets.GOOGLE_CALENDAR_TOKEN_JSON_B64 }}
        run: |
          set -euo pipefail

          if [ -z "${GOOGLE_CALENDAR_CREDENTIALS_JSON_B64}" ]; then
            echo "Missing GOOGLE_CALENDAR_CREDENTIALS_JSON_B64 secret."
            exit 1
          fi

          if [ -z "${GOOGLE_CALENDAR_TOKEN_JSON_B64}" ]; then
            echo "Missing GOOGLE_CALENDAR_TOKEN_JSON_B64 secret."
            exit 1
          fi

          printf '%s' "${GOOGLE_CALENDAR_CREDENTIALS_JSON_B64}" | base64 --decode > credentials.json
          printf '%s' "${GOOGLE_CALENDAR_TOKEN_JSON_B64}" | base64 --decode > token.json

      - name: Send Team ShiNola email with retries
        if: steps.dedupe.outputs.should_send == 'true'
        shell: bash
        run: |
          set +e
          : > couple-brief-run.log

          for attempt in 1 2 3; do
            echo "::group::Team ShiNola attempt ${attempt}" | tee -a couple-brief-run.log
            daily-brief --couple --send 2>&1 | tee -a couple-brief-run.log
            status=${PIPESTATUS[0]}
            echo "::endgroup::"

            if [ "$status" -eq 0 ]; then
              echo "Team ShiNola brief sent on attempt ${attempt}." | tee -a couple-brief-run.log
              exit 0
            fi

            echo "Attempt ${attempt} failed with exit code ${status}." | tee -a couple-brief-run.log
            if [ "$attempt" -lt 3 ]; then
              echo "Waiting 15 minutes before retry..." | tee -a couple-brief-run.log
              sleep 900
            fi
          done

          exit 1

      - name: Write email sent marker
        if: success() && steps.dedupe.outputs.should_send == 'true' && steps.email-marker.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "$(dirname "${{ steps.send-marker.outputs.path }}")"
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "trigger=${GITHUB_EVENT_NAME}"
            echo "brief_date=${{ steps.send-marker.outputs.date }}"
            echo "sent_at=$(date -u +%FT%TZ)"
          } > "${{ steps.send-marker.outputs.path }}"

      - name: Save email sent marker
        if: success() && steps.dedupe.outputs.should_send == 'true' && steps.email-marker.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.send-marker.outputs.path }}
          key: email-sent-${{ steps.send-marker.outputs.slug }}-${{ steps.send-marker.outputs.date }}

      - name: Send failure alert
        if: failure() && steps.dedupe.outputs.should_send == 'true'
        run: |
          daily-brief --send-failure-alert \
            --failure-alert-name "Team ShiNola - Our Daily Brief" \
            --failure-log couple-brief-run.log \
            --failure-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
